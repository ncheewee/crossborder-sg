name: Hourly checkpoint variance charts

on:
  schedule:
    # The Mi6 capture runs on the hour. Leave time for it to reach the Worker.
    - cron: "12 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-checkpoint-variance-charts
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Send hourly variance charts from freshest device capture
        env:
          CROSSBORDER_API_BASE: https://crossborder-sg-api.ncheewee.workers.dev
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/report-v3-checkpoint-variance.mjs
      - name: Append Checkpoint.sg row from the Worker
        env:
          CROSSBORDER_API_BASE: https://crossborder-sg-api.ncheewee.workers.dev
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CHECKPOINT_SHEET_WEBAPP_URL: ${{ secrets.CHECKPOINT_SHEET_WEBAPP_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: node scripts/append-checkpoint-sheet.mjs
