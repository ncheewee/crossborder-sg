name: Checkpoint variance (hourly data, daily Telegram)

on:
  schedule:
    # Hourly: collect only (history + Checkpoint.sg sheet row). No Telegram.
    - cron: "0 * * * *"
    # Daily 06:30 SGT (22:30 UTC): Telegram yesterday's Crossborder vs
    # Checkpoint.sg comparison plus where both stand now. GitHub cron often
    # starts 15–50 minutes late, so expect it between about 06:45 and 07:20.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      daily_report:
        description: "Send the daily Telegram report now"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Separate groups so a queued hourly run can never cancel the daily report.
  group: checkpoint-variance-${{ (github.event.schedule == '30 22 * * *' || inputs.daily_report) && 'daily' || 'hourly' }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Collect hourly, or send the daily Telegram report
        env:
          DAILY_REPORT: ${{ (github.event.schedule == '30 22 * * *' || inputs.daily_report) && '1' || '0' }}
          CROSSBORDER_API_BASE: https://crossborder-sg-api.ncheewee.workers.dev
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CHECKPOINT_SHEET_WEBAPP_URL: ${{ secrets.CHECKPOINT_SHEET_WEBAPP_URL }}
        run: node scripts/report-v3-checkpoint-variance.mjs
