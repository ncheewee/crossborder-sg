name: Hourly checkpoint variance charts

on:
  schedule:
    # Once an hour, on the SGT hour (20:00 SGT = 12:00 UTC). GitHub may be a
    # few minutes late; do not add a second cron.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-checkpoint-variance-charts
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Send hourly variance charts from freshest device capture
        env:
          CROSSBORDER_API_BASE: https://crossborder-sg-api.ncheewee.workers.dev
          MONITOR_API_KEY: ${{ secrets.MONITOR_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          CHECKPOINT_SHEET_WEBAPP_URL: ${{ secrets.CHECKPOINT_SHEET_WEBAPP_URL }}
        run: node scripts/report-v3-checkpoint-variance.mjs
